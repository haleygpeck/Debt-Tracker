<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fff8fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2e1220" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Debt Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Debt Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff8fb;--bg2:#ffe6f0;--surface:rgba(255,253,254,.88);--text:#5a2d44;--muted:#9c6682;--line:#fbe0ec;
  --accent:#e45c97;--accent2:#f58fbc;--accent-text:#ffffff;--good:#2f9d6a;--bad:#d6334f;--track:#fde6f0;--chip:#fff0f6;--shadow:0 6px 18px rgba(232,106,166,.13);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#2e1220;--bg2:#4f1e3a;--surface:rgba(63,26,47,.84);--text:#ffe8f1;--muted:#e3a9c4;--line:#68304d;
    --accent:#ff8fc0;--accent2:#ffb5d8;--accent-text:#3a0f26;--good:#6fdba5;--bad:#ff8a9b;--track:#68304d;--chip:#54243d;--shadow:0 6px 18px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#2e1220;--bg2:#4f1e3a;--surface:rgba(63,26,47,.84);--text:#ffe8f1;--muted:#e3a9c4;--line:#68304d;
  --accent:#ff8fc0;--accent2:#ffb5d8;--accent-text:#3a0f26;--good:#6fdba5;--bad:#ff8a9b;--track:#68304d;--chip:#54243d;--shadow:0 6px 18px rgba(0,0,0,.3);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,var(--bg2) 0,var(--bg) 320px) no-repeat,var(--bg);color:var(--text);font:16px/1.4 "Fredoka","Quicksand",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
.wrap{position:relative;max-width:760px;margin:0 auto;padding:16px 14px 48px}
h1{font-family:"Pacifico","Brush Script MT",cursive;font-weight:400;font-size:32px;line-height:1.25;margin:6px 0 8px;color:var(--accent);text-align:center}
.sub{color:var(--muted);font-size:14px;line-height:1.4;margin:0 0 8px;text-align:center;min-height:40px;display:flex;align-items:center;justify-content:center;transition:opacity .4s}
.sub.fade{opacity:0}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.stat .k{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-size:20px;font-weight:700;margin-top:2px;word-break:break-word}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);flex:1;min-width:130px}
input,select,button{font:inherit;color:var(--text)}
input[type=number],input[type=date],input[type=search],input[type=text],select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0;max-width:100%}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-height:42px;text-align:left;font-size:16px}
input[type=date]::-webkit-date-and-time-value{text-align:left}
input:focus,select:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border:0;background:var(--chip);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-text);font-weight:600}
.count{color:var(--muted);font-size:13px;margin:4px 2px 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.card.done{opacity:.75}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-weight:700;font-size:17px;margin:0}
.meta{color:var(--muted);font-size:13px;margin-top:2px}
.bal{text-align:right;flex-shrink:0}
.bal b{font-size:20px;display:block}
.bal span{color:var(--muted);font-size:12px}
.bar{height:8px;background:var(--track);border-radius:99px;margin:12px 0;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.hint{font-size:12px;margin-top:2px;color:var(--muted)}
.hint.bad{color:var(--bad);font-weight:600}
.hint.soon{color:var(--accent);font-weight:600}
.mini{min-width:0}
.mini .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.mini .v{font-weight:600;font-size:15px;margin-top:2px}
.mini input{padding:6px 8px;font-size:15px;font-weight:600}
.log{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.log .amt{flex:2;min-width:110px}
.log .dt{flex:2;min-width:130px}
.btn{border:0;background:var(--accent);color:var(--accent-text);border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--chip);color:var(--text);font-weight:500}
.paidtag{color:var(--good);font-weight:700}
details{margin-top:10px}
summary{cursor:pointer;color:var(--muted);font-size:14px}
details.sched>summary{color:var(--text);font-weight:600}
.hist{list-style:none;margin:8px 0 0;padding:0}
.hist li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.x{border:0;background:transparent;color:var(--bad);cursor:pointer;font-size:14px;padding:4px 8px}
.empty{text-align:center;color:var(--muted);padding:28px 8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.note{color:var(--muted);font-size:12.5px;margin:6px 0 0}
.srows{margin-top:6px}
.srow{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.tick{width:32px;height:32px;border-radius:50%;border:2px solid var(--accent);background:transparent;color:var(--accent-text);font-weight:700;cursor:pointer;flex-shrink:0;padding:0}
.srow.paid .tick{background:var(--good);border-color:var(--good)}
.sinfo{flex:1;display:grid;grid-template-columns:1fr auto;gap:0 8px;text-align:left;background:transparent;border:0;padding:6px 4px;cursor:pointer;min-width:0}
.sinfo .sa{font-weight:600;text-align:right}
.sinfo .ss{grid-column:1/-1;font-size:12px;color:var(--muted)}
.srow.late .ss{color:var(--bad);font-weight:600}
.srow.paid .sl{text-decoration:line-through;color:var(--muted)}
.editor{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;margin:6px 0 10px;display:flex;flex-direction:column;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fld2{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.sactions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ccard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer}
.ccard.done{opacity:.75}
.ccard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ccard .name{display:block}
.chev{color:var(--muted);font-size:20px;margin-left:6px}
.meta.bad{color:var(--bad);font-weight:600}
.backrow{margin:4px 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;border:0;background:var(--chip);border-radius:12px;padding:11px 8px;font-weight:600;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--accent-text)}
#cardsTab .panel .row{align-items:flex-end}
#grand{margin-bottom:12px;background:linear-gradient(135deg,var(--accent2),var(--accent));border:0;color:var(--accent-text);text-align:center}
#grand .k,#grand .meta{color:inherit;opacity:.92}
#grand .v{font-size:30px}
.card,.ccard{border-radius:22px}
.stat,.panel{border-radius:20px}
.card,.ccard,.stat,.panel{box-shadow:var(--shadow)}
#grand{box-shadow:var(--shadow)}
.editor{border-radius:16px}
.btn{background:linear-gradient(135deg,var(--accent2),var(--accent));border-radius:999px;box-shadow:0 3px 10px rgba(214,64,127,.25)}
.btn.ghost{box-shadow:none}
.tab{border-radius:999px}
.tab[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent2),var(--accent));box-shadow:0 3px 10px rgba(214,64,127,.25)}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,var(--accent2),var(--accent))}
.bar{height:10px}
.bar i{background:linear-gradient(90deg,var(--accent2),var(--accent))}
input[type=number],input[type=date],input[type=search],input[type=text],select{border-radius:14px}
.toolbar{margin:0 0 10px}
.theme{position:absolute;top:12px;right:14px;width:42px;height:42px;border-radius:50%;border:0;background:var(--chip);font-size:20px;line-height:1;cursor:pointer;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;padding:0;z-index:5}
.backrow .btn{margin-right:8px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999}
.btn:not(.ghost),.tab,.chip{position:relative;overflow:hidden}
.btn::after,.tab::after,.chip::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:shine var(--sp,6s) ease-in-out var(--sd,0s) infinite;pointer-events:none}
.btn.ghost::after,.tab:not([aria-pressed="true"])::after,.chip:not([aria-pressed="true"])::after{background:linear-gradient(100deg,transparent,rgba(255,143,191,.4),transparent)}
@keyframes shine{0%,80%{left:-70%}100%{left:140%}}
@media (prefers-reduced-motion:reduce){.btn::after,.tab::after,.chip::after,.btn::before,.tab::before,.chip::before{animation:none!important;display:none}.srow.paid .tick{animation:none!important}}
.btn.ghost{position:relative;overflow:hidden}
.tick{width:38px;height:38px;border:0;border-radius:0;background:transparent;color:var(--accent);font-size:32px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center}
.srow.paid .tick{background:transparent;border:0;color:var(--accent);animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
#floaty{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.wrap{z-index:1}
.fh{position:absolute;bottom:-40px;left:var(--x,50%);font-size:var(--sz,18px);color:var(--accent2);opacity:0;animation:floatUp var(--dur,18s) linear var(--del,0s) infinite}
@keyframes floatUp{0%{transform:translateY(0) translateX(0) rotate(-10deg);opacity:0}10%{opacity:.4}50%{transform:translateY(-55vh) translateX(18px) rotate(10deg)}90%{opacity:.3}100%{transform:translateY(-115vh) translateX(-14px) rotate(-8deg);opacity:0}}
.card,.ccard{position:relative;border:2px solid var(--line);border-radius:28px;padding:22px 16px 16px}
.card::before,.ccard::before{content:"\2661";position:absolute;top:4px;left:16px;font-size:16px;line-height:1;color:var(--accent2);opacity:.7;pointer-events:none}
.card::after,.ccard::after{content:"\2661";position:absolute;bottom:8px;right:16px;font-size:16px;color:var(--accent2);opacity:.7;pointer-events:none}
.stat,.panel{border-radius:24px}
.sticker{display:inline-block;margin-top:4px;padding:2px 10px;border-radius:999px;background:var(--chip);color:var(--accent);font-size:12px;font-weight:600}
/* iPhone zooms into any box with text smaller than 16px, so keep every box at 16px or bigger */
input,select,textarea{font-size:16px!important}
button,input,select,.ccard,.sinfo,.tick,.tab,.chip{touch-action:manipulation}
.sticker{margin-right:6px}
.sticker.prio-high{background:var(--accent);color:var(--accent-text)}
.ugroup{margin-top:0}
.filt{margin-top:12px}
.filt>summary{color:var(--text);font-weight:600}
.fgroup{margin:10px 0 4px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.optrow{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;background:transparent;border:0;border-top:1px solid var(--line);padding:12px 4px;text-align:left;font-size:16px;color:var(--text);cursor:pointer}
.optrow.on{font-weight:700;color:var(--accent)}
.optrow .ck{font-size:18px}
.fld{min-width:0}
div.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);flex:1;min-width:130px}
.msel{position:relative}
.msel-btn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:9px 12px;min-height:42px;font-size:16px;color:var(--text);text-align:left;cursor:pointer}
.msel-btn .mt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msel-btn .car{color:var(--accent);flex-shrink:0}
.msel-btn .plus{background:var(--accent);color:var(--accent-text);border-radius:999px;padding:0 8px;font-size:13px;font-weight:700;flex-shrink:0}
.msel-pop{position:absolute;left:0;top:calc(100% + 6px);width:max(100%,280px);max-width:calc(100vw - 40px);z-index:30;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:4px 14px 14px;box-shadow:0 10px 28px rgba(0,0,0,.2)}
.msel-pop .optrow{padding:11px 2px}
.msel-pop .optrow:first-of-type{border-top:0}
.msel-pop .btn{margin-top:6px;width:100%}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{flex:none}
.mrow{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-top:1px solid var(--line)}
.mrow.tot{font-weight:700;font-size:18px;color:var(--accent)}
.mrow.neg{color:var(--bad)}
.card[role="button"]{cursor:pointer}
.mrow input{width:96px;min-width:0;text-align:right;padding:6px 8px}
.hsec{margin:18px 4px 8px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.tab{padding:10px 2px;font-size:13px;white-space:nowrap}
.tickgap{width:38px;height:38px;flex-shrink:0}
.gear{right:auto;left:14px}
.tools{text-align:center}
.tools .row{justify-content:center}
.ch-line{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.ch-area{fill:var(--accent2);fill-opacity:.28}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-dot{fill:var(--accent);stroke:var(--bg);stroke-width:2}
.ch-txt{fill:var(--muted);font-size:10px;font-family:inherit}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{border:0;background:var(--chip);border-radius:12px;font-size:20px;line-height:1;padding:7px 8px;cursor:pointer}
@media (prefers-reduced-motion:reduce){#floaty{display:none}}
.nav{position:relative;margin-bottom:12px}
.navbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:13px 18px;font-size:18px;text-align:left}
.nb-burger{font-size:22px;line-height:1}
.nb-label{flex:1;text-align:left}
.nb-car{font-size:16px}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:40;background:var(--bg);border:2px solid var(--line);border-radius:26px;padding:12px;margin:0;box-shadow:0 14px 34px rgba(214,64,127,.25)}
.tabs[hidden]{display:none}
.tab{text-align:left;padding:13px 14px;font-size:15px}
.pagehead{margin:0 0 12px;text-align:center;font-size:20px;font-weight:700;color:var(--accent)}
.scrim{position:fixed;inset:0;background:rgba(60,10,35,.38);z-index:55}
.scrim[hidden]{display:none}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(300px,82vw);z-index:60;background:var(--bg);border-right:2px solid var(--line);box-shadow:8px 0 30px rgba(214,64,127,.25);padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;overflow-y:auto;transform:translateX(-105%);visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s}
.drawer.open{transform:translateX(0);visibility:visible;transition:transform .25s ease,visibility 0s}
.dr-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.dr-title{font-family:"Pacifico","Brush Script MT",cursive;font-size:26px;color:var(--accent)}
.dr-x{width:40px;height:40px;border-radius:50%;border:0;background:var(--chip);font-size:18px;cursor:pointer;color:var(--text)}
.drawer .tabs{display:flex;flex-direction:column;gap:8px;position:static;z-index:auto;background:transparent;border:0;border-radius:0;padding:0;box-shadow:none}
.drawer .tab{width:100%;text-align:left;padding:14px 16px;font-size:16px}
.dr-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.dr-foot .tab{width:100%;text-align:left;padding:14px 16px;font-size:16px;border:0;background:var(--chip);border-radius:999px;cursor:pointer;color:var(--text);font-weight:600;position:relative;overflow:hidden}
@media (prefers-reduced-motion:reduce){.drawer,.drawer.open{transition:none}}
</style>
</head>
<body>
<div id="floaty" aria-hidden="true"></div>
<div class="wrap" id="app">
  <button class="theme" id="themeBtn" aria-label="Switch between light and dark mode">🌙</button>
  <button class="theme gear" id="navBtn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="drawer">☰</button>
  <h1>Debt Tracker ✨</h1>
  <p class="sub" id="status">Loading your plans…</p>
  <div class="panel tools" id="toolsPanel" hidden>
    <div class="row">
      <button class="btn ghost" id="backupBtn">💾 Back up my data</button>
      <button class="btn ghost" id="restoreBtn">📂 Restore from backup</button>
      <button class="btn ghost" id="toolsClose">✕ Close</button>
    </div>
    <input type="file" id="restoreFile" accept="application/json,.json" hidden>
    <p class="note" id="backupNote"></p>
  </div>
  <p class="pagehead" id="navLabel">🏠 Home</p>
  <div class="stat" id="grand"></div>

  <div id="affirmTab">
  <div id="browse">
  <div class="summary" id="summary"></div>

  <div class="panel">
    <div class="row">
      <div class="fld"><span>Sort by</span><div id="sortSel"></div></div>
      <label class="fld">Search
        <input type="search" id="q" placeholder="e.g. Amazon">
      </label>
    </div>
    <div class="chips" id="chips">
      <button class="chip" data-f="all" aria-pressed="true">All</button>
      <button class="chip" data-f="open" aria-pressed="false">Still owe</button>
      <button class="chip" data-f="paid" aria-pressed="false">Paid off</button>
      <button class="chip" data-f="auto" aria-pressed="false">AutoPay on</button>
      <button class="chip" data-f="archived" aria-pressed="false">Archived</button>
    </div>
  </div>
  <div class="count" id="count"></div>
  </div>
  <div id="list"></div>
  </div>
  <div id="cardsTab" hidden></div>
  <div id="upcomingTab" hidden></div>
  <div id="progressTab" hidden></div>
  <div id="homeTab" hidden></div>
  <div id="billsTab" hidden></div>
  <div id="subsTab" hidden></div>
  <div id="payTab" hidden></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Menu">
  <div class="dr-head"><span class="dr-title">Menu ✨</span><button class="dr-x" id="drawerClose" type="button" aria-label="Close menu">✕</button></div>
  <nav class="tabs" id="tabs">
    <button class="tab" data-tab="home" aria-pressed="true">🏠 Home</button>
    <button class="tab" data-tab="affirm" aria-pressed="false">💗 Affirm plans</button>

<script>
(function(){
  var $ = function(s){return document.querySelector(s);};

  var hist = [], openLater = false, openUp = {over:true, wk:true, mo:false, later:false}, plans = {}, bills = {}, subs = {}, payLog = {}, settings = {}, cards = {}, cardPay = {}, ui = {sorts:['bal-asc'], csorts:['bal-desc'], sortOpen:false, cSortOpen:false, filters:{}, cf:{types:{}, prios:{}}, cfOpen:false, q:'', edit:null, ed:null, auto:null, tab:'home', incEdit:false, incNew:false, inc:null, incdel:false, lgEdit:null, lg:null, lgdel:false, rEdit:null, rd:null, rdel:false, cgEdit:null, cg:null, cgdel:false, rOpen:{}, dueKinds:{}, cardEdit:null, cd:null, confirmDel:null};
  var drafts = {}, openHist = {}, openS = {}, db = null, uid = null, loaded = false, queues = {}, toastT = null;

  function toast(msg){
    var t = $('#toast'); t.textContent = msg; t.classList.add('show');

  }
  function enqueue(key, fn){
    queues[key] = (queues[key] || Promise.resolve()).then(fn).catch(function(e){
      toast('Couldn’t save that. ' + (e && e.message ? e.message : ''));
    });

  }
  function nid(){ return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

  /* ---------- sparkle & confetti ---------- */
  var lastTap = {x: window.innerWidth / 2, y: window.innerHeight / 2};
  var fx = (function(){
    var cv = document.getElementById('fx');
    var ctx = cv && cv.getContext ? cv.getContext('2d') : null;
    var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    var parts = [], raf = null, rainT = null;
    var COLORS = ['#ff8fbf','#ffb3d5','#ffd1e6','#ffffff','#ffd86b','#f6a6ff','#ff6fa8','#e8579a'];
    function size(){ if (!ctx) return; var d = window.devicePixelRatio || 1; cv.width = window.innerWidth * d; cv.height = window.innerHeight * d; ctx.setTransform(d,0,0,d,0,0); }
    size(); window.addEventListener('resize', size);
    function rnd(a, b){ return a + Math.random() * (b - a); }
    function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
    function mk(x, y, vx, vy, g, kind, max){
      return {x:x, y:y, vx:vx, vy:vy, g:g, kind:kind, c:pick(COLORS), r:rnd(3,7), rot:rnd(0,6.28), vr:rnd(-.25,.25), life:0, max:max, tw:rnd(0,6.28)};
    }
    function add(p){ parts.push(p); if (!raf) raf = requestAnimationFrame(tick); }
    function burst(x, y, n, small){
      if (reduce || !ctx) return;
      for (var i = 0; i < n; i++) {
        var a = rnd(0, 6.2832), s = small ? rnd(1.5, 5) : rnd(4, 11);
        add(mk(x, y, Math.cos(a) * s, Math.sin(a) * s - (small ? 1 : 4), small ? .08 : .18,
          pick(small ? ['star','dot','star'] : ['rect','rect','star','dot']), small ? rnd(30, 55) : rnd(90, 170)));
      }
    }
    function rain(ms){
      if (reduce || !ctx) return;
      var end = Date.now() + ms;
      clearInterval(rainT);
      rainT = setInterval(function(){
        if (Date.now() > end) { clearInterval(rainT); return; }
        for (var i = 0; i < 4; i++) add(mk(rnd(0, window.innerWidth), -10, rnd(-.8,.8), rnd(1.2,3), .03, pick(['dot','dot','star','rect']), rnd(200, 320)));
      }, 45);
    }
    function celebrate(){
      var w = window.innerWidth, hh = window.innerHeight;
      burst(w * .15, hh * .65, 55); burst(w * .85, hh * .65, 55); burst(w * .5, hh * .4, 80); rain(2800);
    }
    function tick(){
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      var alive = [];
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i]; p.life++;
        p.vx *= .99; p.vy += p.g; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
        if (p.life > p.max || p.y > window.innerHeight + 20) continue;
        var fade = Math.min(1, (p.max - p.life) / 30);
        var tw = p.kind === 'dot' ? (.55 + .45 * Math.sin(p.life * .35 + p.tw)) : 1;
        ctx.save(); ctx.globalAlpha = Math.max(0, fade * tw); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c;
        if (p.kind === 'rect') ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
        else if (p.kind === 'dot') { ctx.beginPath(); ctx.arc(0, 0, p.r * .5, 0, 6.2832); ctx.fill(); }
        else { var r = p.r * 1.6; ctx.beginPath(); ctx.moveTo(0,-r); ctx.quadraticCurveTo(0,0,r,0); ctx.quadraticCurveTo(0,0,0,r); ctx.quadraticCurveTo(0,0,-r,0); ctx.quadraticCurveTo(0,0,0,-r); ctx.fill(); }
        ctx.restore(); alive.push(p);

      raf = parts.length ? requestAnimationFrame(tick) : null;

  })();
  document.addEventListener('click', function(e){

  var PICKS = ['🛍️','🎀','💖','✨','🍔','🎫','📚','🏨','👗','👠','💄','🐾','📦','🛒','🚗','💳','🏠','✈️','🎧','💍','🎬','🎵','📱','💡','🚿','📺','🏋️','☁️'];

    return d;
  }
  function emojiFor(p){

    if (p.rkind) {
      var RK = [['netflix','🎬'],['hulu','📺'],['disney','🏰'],['spotify','🎵'],['youtube','📺'],['icloud','☁️'],['gym','🏋️'],['rent','🏠'],['mortgage','🏠'],['electric','💡'],['water','🚿'],['internet','🌐'],['phone','📱'],['insurance','🛡️'],['amazon','📦'],['hbo','🎬'],['paramount','🎬'],['peacock','🎬']];
      for (var j = 0; j < RK.length; j++) if (n.indexOf(RK[j][0]) >= 0) return RK[j][1];
      var CE = {'Housing':'🏠','Utilities':'💡','Phone & internet':'📱','Insurance':'🛡️','Transportation':'🚗','Medical':'🏥','Childcare':'🧸','Streaming':'🎬','Music':'🎵','Apps & software':'📱','Shopping':'🛍️','Fitness':'🏋️','News & reading':'📰','Gaming':'🎮','Cloud storage':'☁️'};
      return CE[p.category] || (p.rkind === 'bill' ? '🧾' : '🔁');
    }
    var map = [['doordash','🍔'],['stubhub','🎫'],['ticket','🎫'],['goodwill','👗'],['barnes','📚'],['hilton','🏨'],['hotel','🏨'],['ross','👗'],['vet','🐾'],['amazon','📦'],['maxx','🛍️'],['meijer','🛒'],['walmart','🛒'],['macy','👠'],['shein','👗'],['lovisa','💍'],['best buy','🎧'],['target','🎯'],['uber','🚗'],['sephora','💄'],['ulta','💄']];
    for (var i = 0; i < map.length; i++) if (n.indexOf(map[i][0]) >= 0) return map[i][1];
    if (p.isDebt) return {'Credit card':'💳','Personal loan':'💸','Auto loan':'🚗','Student loan':'🎓','Medical':'🏥','Family or friend':'👭'}[p.type || ''] || '✨';
    return '🎀';
  }
  function pctPaid(p, rem){ return p.start > 0 ? (p.start - rem) / p.start * 100 : 100; }
  function milestoneHit(before, after){
    var T = [[75,'Almost there, 75% paid! 👑'],[50,'Halfway there! 💖'],[25,'25% paid down, great start! 🌸']];
    for (var i = 0; i < T.length; i++) if (before < T[i][0] && after >= T[i][0]) return T[i][1];
    return null;
  }
  function stickerEl(pct, done){
    var t = '';
    if (done) t = '🏆 Paid off';
    else if (pct >= 75) t = '👑 75% paid';
    else if (pct >= 50) t = '💖 Halfway there';
    else if (pct >= 25) t = '🌸 25% paid';

  }

  /* ---------- dates ---------- */
  function isoOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function isoToday(){ return isoOf(new Date()); }
  function isoToLocal(s){ var a = (s||'').split('-').map(Number); return (a.length===3 && !a.some(isNaN)) ? new Date(a[0],a[1]-1,a[2]) : null; }
  function addMonths(d, n){
    var x = new Date(d.getFullYear(), d.getMonth() + n, 1);
    var last = new Date(x.getFullYear(), x.getMonth()+1, 0).getDate();
    x.setDate(Math.min(d.getDate(), last)); return x;
  }
  function fmtDate(d){ return d ? d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—'; }

  /* ---------- math ---------- */
  function paidSum(p){ return (p.payments||[]).reduce(function(s,x){return s + (Number(x.amount)||0);},0); }
  function remaining(p){ return Math.max(0, r2((p.start||0) - paidSum(p))); }
  function monthly(p){
    if (p.monthly > 0) return p.monthly;
    if (p.isDebt) return p.min > 0 ? p.min : 0;
    var left = Math.max(1, (p.total||1) - (p.done||0));
    return r2((p.start||0) / left);
  }
  function sched(p){
    return (p.sched||[]).slice().sort(function(a,b){
      return (a.date||'9999').localeCompare(b.date||'9999') || (a.id < b.id ? -1 : 1);
    });
  }
  function isPaidS(p, s){ return (p.payments||[]).some(function(x){return x.sid === s.id;}); }
  function baseDate(p){
    var d = p && p.due ? isoToLocal(p.due) : null;
    if (d) return d;
    d = settings.nextDue ? isoToLocal(settings.nextDue) : null;
    if (d) return d;
    var t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate());
  }
  function info(p){
    var rem = remaining(p), out = {rem:rem, left:0, payoff:null, next:null, nextAmt:null, hasSched:(p.sched||[]).length > 0};
    if (rem < 0.005) return out;
    var m = monthly(p);
    var u = sched(p).filter(function(s){ return !isPaidS(p, s) && s.date && s.amount > 0; });
    if (u.length) {
      out.next = u[0].date; out.nextAmt = u[0].amount;
      var cum = 0, last = null;
      for (var i = 0; i < u.length; i++) {
        cum = r2(cum + u[i].amount); last = isoToLocal(u[i].date);
        if (cum >= rem - 0.005) { out.left = i + 1; out.payoff = last; return out; }
      }
      if (!(m > 0)) { out.left = u.length; out.payoff = last; return out; }
      var extra = Math.max(1, Math.ceil((rem - cum) / m - 1e-9));
      out.left = u.length + extra; out.payoff = addMonths(last, extra); return out;
    }
    if (!(m > 0)) { out.next = p.due || null; return out; }
    out.left = Math.max(1, Math.ceil(rem / m - 1e-9));
    out.payoff = addMonths(baseDate(p), out.left - 1);
    out.next = p.due || null; out.nextAmt = Math.min(m, rem);
    return out;
  }

  /* ---------- DOM helper ---------- */
  function h(tag, attrs){
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function(k){
      if (k === 'text') el.textContent = attrs[k];

    for (var i = 2; i < arguments.length; i++) { if (arguments[i]) el.appendChild(arguments[i]); }
    return el;
  }
  function labeled(t, el){ return h('label',{class:'fld2'}, h('span',{text:t}), el); }

  /* ---------- list / summary ---------- */
  function dueT(x){ return x.inf.next ? isoToLocal(x.inf.next).getTime() : 8.64e15; }
  function list(){
    var arr = Object.keys(plans).map(function(id){ var p = plans[id]; var inf = info(p); return {id:id, p:p, inf:inf, rem:inf.rem}; });
    var q = ui.q.trim().toLowerCase();
    arr = arr.filter(function(x){
      var F = ui.filters;
      if (F.archived) { if (!x.p.archived) return false; } else if (x.p.archived) return false;
      if (q && x.p.name.toLowerCase().indexOf(q) < 0) return false;
      if (F.open || F.paid) {
        if (!((F.open && x.rem > 0.004) || (F.paid && x.rem <= 0.004))) return false;
      }
      if (F.auto && !x.p.autopay) return false;
      return true;
    });
    function pt(x){ return x.inf.payoff ? x.inf.payoff.getTime() : -1; }
    var CMP = {
      'bal-asc': function(a,b){ return a.rem - b.rem; },
      'bal-desc': function(a,b){ return b.rem - a.rem; },
      'pay-asc': function(a,b){ return pt(a) - pt(b); },
      'pay-desc': function(a,b){ return pt(b) - pt(a); },
      'due': function(a,b){ return dueT(a) - dueT(b); },
      'name': function(a,b){ return a.p.name.localeCompare(b.p.name); }
    };
    arr.sort(function(a,b){
      var d = 0;
      for (var i = 0; i < ui.sorts.length && !d; i++) { var f = CMP[ui.sorts[i]]; if (f) d = f(a, b); }
      if (!d) d = a.p.name.localeCompare(b.p.name) || a.id.localeCompare(b.id);
      return d;
    });
    return arr;
  }

  function renderSummary(){
    var all = Object.keys(plans).map(function(id){return plans[id];}).filter(function(p){ return !p.archived; });
    var rem = 0, paid = 0, mo = 0, last = null, open = 0, week = 0;
    var limit = new Date(); limit.setDate(limit.getDate() + 7); var lim = isoOf(limit);
    all.forEach(function(p){
      var inf = info(p); rem += inf.rem; paid += paidSum(p);
      if (inf.rem > 0.004) {
        open++; mo += Math.min(monthly(p), inf.rem);
        if (inf.payoff && (!last || inf.payoff > last)) last = inf.payoff;
        if (inf.next && inf.next <= lim) week += Math.min(inf.nextAmt || 0, inf.rem);
      }
    });
    var box = $('#summary'); box.textContent = '';
    function stat(k, v){ box.appendChild(h('div',{class:'stat'}, h('div',{class:'k',text:k}), h('div',{class:'v',text:v}))); }
    stat('Total still owed', money(r2(rem)));
    stat('Debt-free date', open ? fmtDate(last) : (all.length ? 'Done! 🎉' : '—'));
  }

  /* ---------- schedule UI ---------- */
  function editor(id, s){

    var d = h('input',{type:'date','data-id':id,'data-act':'ed-date','aria-label':'Due date'}); d.value = e.date || '';

  function schedSection(x){

    var det = h('details',{class:'sched','data-id':id,'data-kind':'sched'},

    var box = h('div',{class:'srows'});
    if (!rows.length) box.appendChild(h('p',{class:'note',text:'Nothing scheduled yet. Add payments one at a time, or auto-fill them from a first due date.'}));

        h('button',{class:'tick','data-act':'toggle','data-id':id,'data-sid':s.id,'aria-label':(paid ? 'Mark unpaid: payment ' : 'Mark paid: payment ') + (i+1),text:paid ? '♥' : '♡'}),

  /* ---------- card ---------- */
  function card(x){
    var p = x.p, id = x.id, rem = x.rem, inf = x.inf, done = rem <= 0.004;
    var pct = p.start > 0 ? Math.min(100, Math.max(0, (p.start - rem) / p.start * 100)) : 100;
    var bar = h('i'); bar.style.width = pct.toFixed(1) + '%';
    var d = drafts[id] || {};
    var m = monthly(p);

    var mInput = h('input',{type:'number',step:'0.01',min:'0.01',inputmode:'decimal','data-id':id,'data-act':'monthly','aria-label':'Typical payment for ' + p.name});
    mInput.value = (p.monthly > 0 ? p.monthly : m).toFixed(2);

    var dueBox = h('div',{class:'mini'}, h('div',{class:'k',text:'Next due'}));
    var hint = h('div',{class:'hint'});
    if (inf.hasSched) {
      dueBox.appendChild(h('div',{class:'v',text: done ? '—' : (inf.next ? fmtDate(isoToLocal(inf.next)) + (inf.nextAmt ? ' · ' + money(inf.nextAmt) : '') : 'None left')}));
    } else {
      var dInput = h('input',{type:'date','data-id':id,'data-act':'due','aria-label':'Due date for ' + p.name});
      dInput.value = p.due || ''; dueBox.appendChild(dInput);
    }
    if (!done) {
      if (!inf.next) { if (!inf.hasSched) hint.textContent = 'Set a due date'; }
      else {
        var diff = Math.round((isoToLocal(inf.next) - isoToLocal(isoToday())) / 864e5);
        if (diff < 0) { hint.className = 'hint bad'; hint.textContent = 'Overdue by ' + (-diff) + (diff === -1 ? ' day' : ' days'); }
        else if (diff <= 7) { hint.className = 'hint soon'; hint.textContent = diff === 0 ? 'Due today' : 'Due in ' + diff + (diff === 1 ? ' day' : ' days'); }
      }
    }
    dueBox.appendChild(hint);

    var amt = h('input',{type:'number',step:'0.01',min:'0.01',inputmode:'decimal',placeholder:'Amount paid',class:'amt','data-id':id,'data-act':'amt','aria-label':'Extra payment toward ' + p.name});
    if (d.amt) amt.value = d.amt;

  function makeLocalDb(){
    var KEY = 'debt-tracker-data-v1', store = null;
    try { store = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e){ store = null; }
    if (!store) { store = JSON.parse(JSON.stringify(SEED)); }
    var listeners = [];
    function persist(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }
    function notify(){ listeners.forEach(function(fn){ fn(); }); }
    function copy(o){ return JSON.parse(JSON.stringify(o)); }
    function snap(){
      return {metadata:{fromCache:false}, docs:Object.keys(store).sort().map(function(id){
        return {id:id, data:function(){ return copy(store[id]); }};
      })};
    }
    return {
      exportAll: function(){ return copy(store); },
      importAll: function(o){ store = copy(o); persist(); notify(); },
      doc: function(path){
        var id = path.split('/').pop();
        return {
          set: function(d){ store[id] = copy(d); persist(); notify(); return Promise.resolve(); },
          update: function(d){
            if (!store[id]) return Promise.reject(new Error('That item no longer exists.'));
            Object.assign(store[id], copy(d)); persist(); notify(); return Promise.resolve();
          },
          delete: function(){ delete store[id]; persist(); notify(); return Promise.resolve(); }
        };
      },
      collection: function(){
        return { onSnapshot: function(next){
          var fn = function(){ next(snap()); };
          listeners.push(fn); setTimeout(fn, 0);
          return function(){ listeners = listeners.filter(function(x){ return x !== fn; }); };
        }};
      }
    };
  }
